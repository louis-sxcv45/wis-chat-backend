services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel-app

    volumes:
      - storage:/var/www/html/storage
    
    env_file: .env

    depends_on:
      - db

    networks:
      - app-network

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    
    container_name: laravel-nginx
    
    ports:
      - "8080:80"
    
    volumes:
      - storage:/var/www/html/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    
    depends_on:
      - app
      - reverb
    
    networks:
      - app-network
    
    restart: unless-stopped
  
  db:
    image: mysql:8.0

    container_name: laravel-db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: wis-chat-db
      MYSQL_USER: user
      MYSQL_PASSWORD: secret1234
      MYSQL_ROOT_PASSWORD: hidden123

    volumes:
      - dbdata:/var/lib/mysql

    networks:
      - app-network

  reverb:
    image: wis-reverb

    container_name: laravel-reverb

    command: php artisan reverb:start --host=0.0.0.0 --port=8080

    env_file: .env
    
    depends_on:
      - app
    
    networks:
      - app-network
    
    restart: unless-stopped
  
  queue:
    image: wis-queue

    container_name: laravel-queue

    command: php artisan queue:work --sleep=3 --tries=3

    env_file: .env

    depends_on:
      - app
      - db

    networks:
      - app-network

    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  storage:
    driver: local